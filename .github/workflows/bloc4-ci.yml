name: Bloc 4 - CI

on:
  push:
    branches: [main]
    paths:
      - bloc4-mlops/**
      - .github/workflows/bloc4-ci.yml
  pull_request:
    paths:
      - bloc4-mlops/**
      - .github/workflows/bloc4-ci.yml

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloc4-mlops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bloc4-mlops/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests (pytest + coverage)
        run: pytest -q --cov=api --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build builder stage (deps + CLIP prewarm, no artifacts needed)
        uses: docker/build-push-action@v6
        with:
          context: bloc4-mlops
          target: builder
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
