apiVersion: apps/v1
kind: Deployment
metadata:
  name: miroir-api
  labels:
    app: miroir-api
    bloc: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miroir-api
  template:
    metadata:
      labels:
        app: miroir-api
    spec:
      containers:
        - name: miroir-api
          image: miroir-api:latest
          ports:
            - containerPort: 8000
          env:
            # Cohabitation LightGBM / CLIP (OpenMP) — voir ADR-0007 et api/main.py
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: KMP_DUPLICATE_LIB_OK
              value: "TRUE"
            # En production, pointer vers un serveur MLflow externe (registry partagé)
            - name: MLFLOW_TRACKING_URI
              value: "sqlite:////app/mlflow.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
